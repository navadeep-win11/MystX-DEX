name: Build MystX DEX APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MystX DEX Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Fetch PRoot Binaries
        run: |
          mkdir -p app/src/main/assets/mystx/proot
          ARCHS=("aarch64" "arm" "i686" "x86_64")
          PROOT_VERSION="5.1.107.92"
          LIBTALLOC_VERSION="2.4.3"
          LIBANDROID_SHMEM_VERSION="0.7"
          for arch in "${ARCHS[@]}"; do
              echo "Downloading proot for $arch..."
              wget -q "https://packages-cf.termux.dev/apt/termux-main/pool/main/p/proot/proot_${PROOT_VERSION}_${arch}.deb"
              wget -q "https://packages-cf.termux.dev/apt/termux-main/pool/main/libt/libtalloc/libtalloc_${LIBTALLOC_VERSION}_${arch}.deb"
              wget -q "https://packages-cf.termux.dev/apt/termux-main/pool/main/liba/libandroid-shmem/libandroid-shmem_${LIBANDROID_SHMEM_VERSION}_${arch}.deb"
              
              mkdir -p proot_extracted_$arch
              cd proot_extracted_$arch
              ar x "../proot_${PROOT_VERSION}_${arch}.deb"
              tar xf data.tar.xz ./data/data/com.termux/files/usr/bin ./data/data/com.termux/files/usr/libexec
              
              ar x "../libtalloc_${LIBTALLOC_VERSION}_${arch}.deb"
              tar xf data.tar.xz ./data/data/com.termux/files/usr/lib
              
              ar x "../libandroid-shmem_${LIBANDROID_SHMEM_VERSION}_${arch}.deb"
              tar xf data.tar.xz ./data/data/com.termux/files/usr/lib
              
              cd ..
              mkdir -p "app/src/main/assets/mystx/proot/$arch/bin"
              mkdir -p "app/src/main/assets/mystx/proot/$arch/libexec/proot"
              mkdir -p "app/src/main/assets/mystx/proot/$arch/lib"
              
              cp "proot_extracted_$arch/data/data/com.termux/files/usr/bin/proot" "app/src/main/assets/mystx/proot/$arch/bin/"
              cp "proot_extracted_$arch/data/data/com.termux/files/usr/libexec/proot/"* "app/src/main/assets/mystx/proot/$arch/libexec/proot/"
              cp -d "proot_extracted_$arch/data/data/com.termux/files/usr/lib/"*.so* "app/src/main/assets/mystx/proot/$arch/lib/" 2>/dev/null || true
              
              rm -rf "proot_${PROOT_VERSION}_${arch}.deb" "libtalloc_${LIBTALLOC_VERSION}_${arch}.deb" "libandroid-shmem_${LIBANDROID_SHMEM_VERSION}_${arch}.deb" "proot_extracted_$arch"
          done
          echo "PRoot binaries bundled into assets."

      - name: Build MystX DEX Debug APK
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: |
          echo "==> Building MystX DEX Android Application..."
          ./gradlew assembleDebug --stacktrace

          APK_DIR="app/build/outputs/apk/debug"
          echo "==> Build finished. Listing generated APKs in $APK_DIR:"
          ls -la "$APK_DIR"

          VERSION="$(./gradlew -q :app:versionName)"
          echo "MYSTX_VERSION=$VERSION" >> $GITHUB_ENV
          echo "==> MystX DEX Version: $VERSION"

          # Create friendly named APKs
          UNIVERSAL_APK=$(find "$APK_DIR" -name "*universal*.apk" | head -n 1)
          if [ -f "$UNIVERSAL_APK" ]; then
            cp "$UNIVERSAL_APK" "$APK_DIR/MystX-Dex-v${VERSION}.apk"
            cp "$UNIVERSAL_APK" "$APK_DIR/MystX-Dex-v${VERSION}-universal.apk"
            echo "Created $APK_DIR/MystX-Dex-v${VERSION}.apk from $UNIVERSAL_APK"
          fi

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MystX-Dex-v${{ env.MYSTX_VERSION }}-Universal
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: warn

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: MystX-Dex-v${{ env.MYSTX_VERSION }}-All-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: MystX DEX ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/debug/MystX-Dex-v*.apk
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
