name: Build MystX DEX APK

on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build MystX DEX Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build MystX DEX Debug APK
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: |
          echo "==> Building MystX DEX Android Application..."
          ./gradlew assembleDebug --stacktrace

          APK_DIR="app/build/outputs/apk/debug"
          echo "==> Build finished. Listing generated APKs in $APK_DIR:"
          ls -la "$APK_DIR"

          VERSION="$(./gradlew -q :app:versionName)"
          echo "MYSTX_VERSION=$VERSION" >> $GITHUB_ENV
          echo "==> MystX DEX Version: $VERSION"

          # Verify universal or architecture APK was generated
          find "$APK_DIR" -name "*.apk" | while read -r apk_file; do
            echo "Found generated APK: $apk_file"
          done

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MystX-Dex-v${{ env.MYSTX_VERSION }}-Universal
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: warn

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: MystX-Dex-v${{ env.MYSTX_VERSION }}-All-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          name: MystX DEX Release ${{ github.ref_name }}
          draft: false
          prerelease: false
