name: Publish Release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact from Build
        uses: actions/download-artifact@v4
        with:
          name: MystX-Dex-v0.118.0-Universal
          run-id: 33881673257
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK
        run: |
          ls -la
          APK=$(find . -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          cp "$APK" MystX-Dex-v0.118.0.apk
          sha256sum MystX-Dex-v0.118.0.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.118.0
          name: MystX DEX v0.118.0 (Official Compiled Release)
          body: |
            ### MystX DEX v0.118.0 Release
            - **Application ID**: `com.mystx.dex`
            - **Application Label**: `MystX DEX`
            - **Custom Logo**: Metallic emblem branding
            - **Web GUI**: DSH-Web styled dashboard
            - **CLI**: `mystx` command on `http://127.0.0.1:8888`
            - **Clean Build**: Compiled with full classes.dex package alignment for `com.mystx.dex`.
          files: MystX-Dex-v0.118.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
