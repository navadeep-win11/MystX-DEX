<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mystxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="mystxGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="#0b0f19" />
  <g transform="translate(40, 40) scale(0.85)">
    <!-- Hexagonal Matrix Frame -->
    <polygon points="256,40 430,140 430,340 256,440 82,340 82,140" fill="none" stroke="url(#mystxGrad1)" stroke-width="12" opacity="0.4" />
    <!-- Dynamic MystX Wings -->
    <path d="M130,120 L210,120 L370,360 L290,360 Z" fill="url(#mystxGrad1)" filter="url(#glow)" />
    <path d="M370,120 L290,120 L130,360 L210,360 Z" fill="url(#mystxGrad2)" opacity="0.9" />
    <!-- Center Core Node -->
    <circle cx="250" cy="240" r="26" fill="#0b0f19" stroke="#00F0FF" stroke-width="8" />
    <circle cx="250" cy="240" r="12" fill="#00F0FF" />
  </g>
</svg>
